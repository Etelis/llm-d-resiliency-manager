apiVersion: v1
kind: ServiceAccount
metadata:
  name: resiliency-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resiliency-manager
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resiliency-manager
subjects:
  - kind: ServiceAccount
    name: resiliency-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resiliency-manager
