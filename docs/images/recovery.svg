<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Coordinating recovery of an EP group</title>
  <desc id="desc">The resiliency manager pauses llm-d routing, recovers and verifies the surviving vLLM ranks, then admits requests to ranks 0, 2 and 3. Rank 1 remains excluded. The routing adapter is required integration.</desc>
  <defs>
    <marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#475569" stroke-width="1.4"/>
    </marker>
    <marker id="traffic" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#2563a6" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1e293b">
    <rect x="460" y="34" width="470" height="286" rx="6" fill="#fafbfc" stroke="#cbd5e1"/>
    <text x="482" y="64" font-size="17" font-weight="600">vLLM · EP group</text>
    <text x="482" y="90" font-size="13" fill="#64748b">Same Pods, one rank excluded</text>

    <rect x="70" y="48" width="244" height="70" rx="5" fill="#fff" stroke="#475569" stroke-width="1.5"/>
    <text x="192" y="78" text-anchor="middle" font-size="18" font-weight="600">Resiliency manager</text>
    <text x="192" y="100" text-anchor="middle" font-size="13" fill="#64748b">Coordinates recovery</text>

    <path d="M314 83H437V128H696V148" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#control)"/>
    <text x="327" y="56" font-size="13">2. Recover</text>
    <text x="327" y="74" font-size="13">and verify</text>

    <path d="M192 118V234" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#control)"/>
    <text x="208" y="166" font-size="13">1. Pause routing</text>
    <text x="208" y="191" font-size="13">3. Admit survivors</text>

    <rect x="70" y="236" width="244" height="66" rx="5" fill="#fff" stroke="#2563a6" stroke-width="1.5"/>
    <text x="192" y="263" text-anchor="middle" font-size="18" font-weight="600">llm-d routing</text>
    <text x="192" y="286" text-anchor="middle" font-size="13" fill="#64748b">Adapter required</text>

    <g text-anchor="middle">
      <rect x="490" y="164" width="88" height="72" rx="4" fill="#edf4fc" stroke="#2563a6"/>
      <text x="534" y="192" font-size="16">Rank 0</text>
      <text x="534" y="216" font-size="12" fill="#2563a6">serving</text>
      <rect x="598" y="164" width="88" height="72" rx="4" fill="#fff7f6" stroke="#b45349" stroke-dasharray="4 3"/>
      <text x="642" y="192" font-size="16" fill="#943c34">Rank 1</text>
      <text x="642" y="216" font-size="12" fill="#943c34">excluded</text>
      <rect x="706" y="164" width="88" height="72" rx="4" fill="#edf4fc" stroke="#2563a6"/>
      <text x="750" y="192" font-size="16">Rank 2</text>
      <text x="750" y="216" font-size="12" fill="#2563a6">serving</text>
      <rect x="814" y="164" width="88" height="72" rx="4" fill="#edf4fc" stroke="#2563a6"/>
      <text x="858" y="192" font-size="16">Rank 3</text>
      <text x="858" y="216" font-size="12" fill="#2563a6">serving</text>
    </g>

    <path d="M314 269H410V284H858V240M534 284V240M750 284V240" fill="none" stroke="#2563a6" stroke-width="1.8"/>
    <g fill="none" stroke="#2563a6" stroke-width="1.8" marker-end="url(#traffic)">
      <path d="M534 259V239"/>
      <path d="M750 259V239"/>
      <path d="M858 259V239"/>
    </g>
    <text x="327" y="253" font-size="13" fill="#2563a6">Requests</text>

    <path d="M70 350H110" stroke="#2563a6" stroke-width="1.8"/>
    <text x="120" y="355" font-size="12" fill="#64748b">Request traffic</text>
    <path d="M270 350H310" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="320" y="355" font-size="12" fill="#64748b">Recovery control</text>
  </g>
</svg>
